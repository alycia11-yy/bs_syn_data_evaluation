[project]
name = "bs_syn_data_evaluation"
version = "0.1.0"
description = "Two-stage human review for the document tampering datasets: author check + realism study"
requires-python = ">=3.10"
dependencies = [
    "nicegui>=2.0.0",
    "bcrypt>=4.0.0",
    "pillow>=10.1.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
